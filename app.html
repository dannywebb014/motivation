<div class="page"><header><div class="logo">motivation<span>.</span></div></header>

<main>
  <div class="quote-card">
    <blockquote id="quote"></blockquote>
    <div class="author" id="author"></div>
  </div>
</main>

<footer>
  <button class="icon-btn" id="another" title="Another quote" aria-label="Another quote">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
  </button>
  <button class="icon-btn" id="openSheet" aria-haspopup="dialog" title="Your quotes" aria-label="Your quotes">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</footer>

<div class="sheet-backdrop" id="sheetBack" role="dialog" aria-modal="true" aria-label="Your quotes">
  <div class="sheet" id="sheet">
    <h2>Your quotes</h2>
    <div class="sub" id="sheetSub">Added here, synced to every device you sign in on.</div>

    <div id="addBox">
      <div class="field"><label for="newQuote">Quote</label><textarea id="newQuote" placeholder="Paste or type a quote…"></textarea></div>
      <div class="field"><label for="newAuthor">Author <span style="text-transform:none;letter-spacing:0;font-weight:400">· optional</span></label><input id="newAuthor" type="text" placeholder="Who said it"></div>
      <div class="row"><button class="btn" id="addQuote">Add quote</button></div>
      <div class="mine" id="mine"></div>
    </div>

    <div class="msg" id="msg"></div>
    <div class="row" style="margin-top:14px"><button class="linkish" id="closeSheet">Close</button></div>
  </div>
</div>
</div>
